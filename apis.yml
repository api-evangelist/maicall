name: MaiCall
description: MaiCall is an AI-powered debt collection platform for non-bank lenders,
  microfinance companies, and collection agencies. Its self-learning voice agents place
  outbound collection calls, negotiate payment plans, and follow up across WhatsApp,
  SMS, and email in 30+ languages and native accents, capturing promises to pay and
  tracking recovery, contact, and cost metrics in real time. The company was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network. MaiCall
  advertises custom API integrations to loan-management systems, CRMs, SIP trunks, and
  payment gateways on request, but publishes no self-serve public API, developer portal,
  or OpenAPI definition at this time.
